name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar versão
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { python -c "from version import APP_VERSION; print(APP_VERSION)" }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') { throw "Versão inválida: $version" }
          $appVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($appVersion -ne $version) { throw "version.py ($appVersion) diverge da release ($version)" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --ignore-requires-python
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Gerar pasta PyInstaller
        run: pyinstaller build.spec --clean --noconfirm

      - name: Compilar instalador Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup não encontrado em $iscc" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Gerar manifesto
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $file = "installer_output\OrionTaxSync_Setup_$env:RELEASE_VERSION.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $file).Length
          $url = "https://github.com/$env:REPOSITORY/releases/download/v$env:RELEASE_VERSION/OrionTaxSync_Setup_$env:RELEASE_VERSION.exe"
          $manifest = [ordered]@{ schema_version=1; version=$env:RELEASE_VERSION; channel='stable'; mandatory=$false; minimum_supported_version='1.0.5'; installer_url=$url; sha256=$hash; size=$size; published_at=(Get-Date).ToUniversalTime().ToString('o'); release_notes='Consulte as notas da release.' }
          $manifest | ConvertTo-Json | Set-Content installer_output\update-manifest.json -Encoding utf8

      - name: Publicar artifact do instalador
        uses: actions/upload-artifact@v4
        with:
          name: OrionTaxSync-Installer-${{ steps.version.outputs.version }}
          path: |
            installer_output/OrionTaxSync_Setup_${{ steps.version.outputs.version }}.exe
            installer_output/update-manifest.json
          retention-days: 30

      - name: Publicar GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer_output/OrionTaxSync_Setup_${{ steps.version.outputs.version }}.exe
            installer_output/update-manifest.json
